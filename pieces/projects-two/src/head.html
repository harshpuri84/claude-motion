<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects, second look</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
// =====================================================================
//  ONE PROJECT, MANY THREADS — 16:9, 60s @ 120 BPM, 24fps, narrated (voice sets the clock once voice.json exists).
//  Paper worlds (diagonal stripes, the hero) cut hard to navy blueprint worlds (the mechanism), as in the reference.
// =====================================================================
const FPS = 24, W = 1920, H = 1080;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const VW = (id, word, n = 1) => { const ws = VL(id).words.filter((w) => w.w.toLowerCase().replace(/[^a-z0-9']/g, '') === word.toLowerCase()); return (ws[n - 1] || ws[0] || { t0: VL(id).t0 }).t0; };
const DURATION = VOICE.duration;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 60, right: 60 };
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive';
const CX = W / 2;

// beats start 0.3s after the previous line ends (the voice is the clock)
const IDS = ['hook', 'harness', 'split', 'session', 'pr', 'library', 'tips', 't1', 't2', 't3', 'close'];
const BEATS_T = { hook: 0 };
const SNAP8 = (t) => Math.ceil(t / E8 - 1e-6) * E8;
IDS.slice(1).forEach((id, i) => { BEATS_T[id] = SNAP8(VL(IDS[i]).t1 + 0.2); });
BEATS_T.end = SNAP8(VL('close').t1 + 0.2);
const FN = [sceneHook, sceneHarness, sceneSplit, sceneSession, scenePR, sceneLibrary, sceneTips, sceneT1, sceneT2, sceneT3, sceneClose];
const ERA_LIST = IDS.map((id, i) => [BEATS_T[id], i + 1 < IDS.length ? BEATS_T[IDS[i + 1]] : BEATS_T.end, () => FN[i]()]);
ERA_LIST.push([BEATS_T.end, DURATION, () => sceneEnd()]);
const NAMES = [...IDS, 'end'];
const SHOTS = ERA_LIST.map(([t0, t1], i) => [NAMES[i], i, t0, t1, NAMES[i]]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'catalogue',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: ERA_LIST.slice(1).map(([t0]) => t0),
  morphs: [],
  cues: {},
  acts: [
    { name: '1 Hook', role: 'build', t0: 0, t1: BEATS_T.session },
    { name: '2 Mechanism', role: 'journey', t0: BEATS_T.session, t1: BEATS_T.tips },
    { name: '3 Tips', role: 'peak', t0: BEATS_T.tips, t1: BEATS_T.close },
    { name: '4 Verdict', role: 'gift', t0: BEATS_T.close, t1: DURATION },
  ],
  board: NAMES.map((k, i) => ({ t: Math.min(ERA_LIST[i][1] - 0.4, ERA_LIST[i][0] + Math.min(0.8 * (ERA_LIST[i][1] - ERA_LIST[i][0]), 8)), title: (i + 1) + ' ' + k, sound: '', next: '' })),
  narration: VOICE.lines.map((l) => ({ id: l.id, t0: l.t0, t1: l.t1, text: l.text.replace(/Clawd/g, 'Claude') })),
};
window.TIMELINE = TIMELINE;
