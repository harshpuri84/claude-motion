<script>
"use strict";
// =====================================================================
//  ONE AIR SHIPMENT — 4:5, 45s @ 120 BPM, 24fps. A carton with a red band goes booking -> POD.
//  Each hand-off stamps it; the last frame returns to the first, changed (dawn -> dusk, empty dock -> a doorstep).
// =====================================================================
const FPS = 24, W = 1080, H = 1350;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 45.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 60, right: 60 };
const HAND = '"Bradley Hand", "Chalkboard SE", "Ink Free", "Segoe Print", "Comic Neue", cursive';
const CX = 540;

const ERA_LIST = [
  [0, 4, () => sceneBooking()], [4, 9, () => scenePickup()], [9, 14, () => sceneConsol()], [14, 18, () => sceneUplift()],
  [18, 23, () => sceneClimb()], [23, 28, () => sceneCruise()], [28, 31, () => sceneNight()], [31, 33, () => sceneTouchdown()],
  [33, 39, () => sceneLastMile()], [39, 45, () => scenePOD()],

const SHOTS = [
  ['booking', 0, 0, 4, 'dawn at the shipper: the booking prints, the carton waits'],
  ['pickup', 1, 4, 9, 'the truck under the power lines'],
  ['consol', 2, 9, 14, 'built into a ULD at the hub'],
  ['uplift', 3, 14, 18, 'night ramp: the ULD rides the loader into the belly'],

  ['pod', 9, 39, 45, 'the doorstep at dusk: signed for'],

const TIMELINE = {

  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [31],
  morphs: [4, 9, 14, 18, 23, 28, 33, 39],
  cues: {},
  acts: [
    { name: 'Origin', role: 'build', t0: 0, t1: 14 },
    { name: 'Main leg', role: 'journey', t0: 14, t1: 23 },
    { name: 'Peak', role: 'peak', t0: 23, t1: 28 },
    { name: 'Night', role: 'silence', t0: 28, t1: 31 },
    { name: 'Touchdown', role: 'gift', t0: 31, t1: 33 },
    { name: 'Destination', role: 'goodbye', t0: 33, t1: 45 },
  ],
  board: [
    { t: 2.5, title: 'Booking', sound: 'one soft pluck, a printer chirp', next: 'the booking slip shrinks into the truck box' },
    { t: 7.0, title: 'Pickup', sound: 'a low pad, wires hum', next: 'the truck box becomes the ULD' },
    { t: 12.0, title: 'Consol', sound: 'plucks on 8ths as cartons stack', next: 'the ULD rides into the plane belly' },
    { t: 16.5, title: 'Uplift', sound: 'engine drone rises', next: 'the belly door becomes a cloud' },
    { t: 21.0, title: 'Climb', sound: 'riser, the groove starts', next: 'cloud into the cloud sea' },
    { t: 26.0, title: 'Main leg', sound: 'fullest groove, gold chimes', next: 'the sun becomes the night earth' },
    { t: 30.0, title: '(silence)', sound: 'near silence, room tone', next: 'hard cut on the hit' },
    { t: 32.0, title: 'Arrival', sound: 'LOUDEST: chord stab + sub', next: 'the wheel becomes the van wheel' },
    { t: 36.5, title: 'Last mile', sound: 'warm pad, a bicycle bell', next: 'the van door becomes the front door' },
    { t: 43.0, title: 'POD', sound: 'a flat chord, decays', next: 'loops to dawn' },
  ],
  narration: [],

window.TIMELINE = TIMELINE;
// =====================================================================
//  kit/core.js — seeded RNG, math, easing, palette, geometry, the hand-drawn drawing kit
//  (wobble on the boil, ink, paint, hatch, pencil, stipple, grain), cameras, mono text.
//  Needs from the piece head: FPS, W, H. Render state: ctx, F (frame), B (boil = floor(F/2)).
// =====================================================================

// ---------------------------------------------------------------------
//  seeded RNG
// ---------------------------------------------------------------------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;

    h ^= 124; h = Math.imul(h, 16777619);

}
function RNG(...xs) {
  const f = mulberry32(hash(...xs));

    f,
    r: (a, b) => a + (b - a) * f(),
    n: (amt) => (f() * 2 - 1) * amt,
    i: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
  };
}

// ---------------------------------------------------------------------
//  math
// ---------------------------------------------------------------------
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
// has absolute time t reached cut time c? (cuts snap to the nearest frame, like shot boundaries)
const past = (t, c) => Math.round(t * FPS + 1e-6) >= Math.round(c * FPS);
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const EZ = {
  o2: (t) => 1 - (1 - clamp(t)) ** 2,
  o3: (t) => 1 - (1 - clamp(t)) ** 3,
  i2: (t) => clamp(t) ** 2,
  i3: (t) => clamp(t) ** 3,
  io: (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2; },
  back: (t) => { t = clamp(t) - 1; return 1 + 2.70158 * t * t * t + 1.70158 * t * t; },
};

// ---------------------------------------------------------------------
//  render state
// ---------------------------------------------------------------------
let ctx = null;   // current 2d context
let F = 0;        // absolute frame index
let B = 0;        // boil index — reseeds every 2 frames (Math.floor(t*12))

const C = {
  ink: '#3a2417', cream: '#efe5cf', paper: '#f4ecd9', paperLine: 'rgba(90,130,190,0.32)',
  orange: '#e58a4e', orangeD: '#c3622e', orangeL: '#f4b27c', terra: '#d97757',
  rose: '#d98b8b', roseD: '#b0616a', roseL: '#efb9b0',
  wood: '#d6a466', woodD: '#a8773f', woodL: '#e9c48f',
  sky: '#9cc4d6', skyD: '#6f9fb8', skyL: '#c9e1ea',
  teal: '#3d9f96', tealL: '#86c9be',
  yellow: '#f0c55a', yellowL: '#f7dd92',
  green: '#5f9c5c', greenL: '#a3cf92',
  red: '#d4382c', redL: '#ea7a6c',
  skin: '#ebb68f', skinD: '#c7815d', skinL: '#f7d4b4',
  lav: 'rgba(104,112,214,0.7)', lavS: 'rgba(104,112,214,0.42)',
  navy: '#0c0d1c', navy2: '#15173a', peri: '#c8d0f0', periD: '#7c86c4', periS: 'rgba(150,164,230,0.20)',
  cyan: '#52d6c4', mag: '#e0368f', glow: '#5de37a', white: '#f4f6ff',
};
const RAINBOW = ['#f0d042', '#e050b8', '#46cde0', '#7ad866', '#a47ef0'];
const MONO = 'Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", "Courier New", monospace';   // Windows first, then macOS / Linux

// ---------------------------------------------------------------------
//  geometry
// ---------------------------------------------------------------------
function ellipsePts(cx, cy, rx, ry, rot = 0, n = 64, a0 = 0, a1 = TAU) {
  const P = [], c = Math.cos(rot), s = Math.sin(rot), full = Math.abs(a1 - a0 - TAU) < 1e-6;
  for (let i = 0; i < n; i++) {
    const a = a0 + (a1 - a0) * i / (full ? n : n - 1);
    const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    P.push([cx + x * c - y * s, cy + x * s + y * c]);
  }
  return P;
}
function rrectPts(x, y, w, h, r, n = 6) {
  r = Math.min(r, w / 2, h / 2);
  const P = [], cs = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of cs) for (let i = 0; i <= n; i++) { const a = a0 + (Math.PI / 2) * i / n; P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return P;
}
function arcPts(cx, cy, r, a0, a1, n = 18, sy = 1) {
  const P = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * sy]); }
  return P;
}
function xform(P, tx, ty, rot = 0, sx = 1, sy = sx) {
  const c = Math.cos(rot), s = Math.sin(rot);
  return P.map(([x, y]) => [tx + x * sx * c - y * sy * s, ty + x * sx * s + y * sy * c]);
}
function bbox(P, pad = 0) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of P) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
  return { x0: x0 - pad, y0: y0 - pad, x1: x1 + pad, y1: y1 + pad };
}
function resample(P, closed, step) {
  const out = [], n = P.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const a = P[i], b = P[(i + 1) % n], k = Math.max(1, Math.ceil(dist(a, b) / step));
    for (let j = 0; j < k; j++) out.push([a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k]);
  }
  if (!closed) out.push(P[n - 1]);
  return out;
}
function pathLen(P) { let L = 0; for (let i = 1; i < P.length; i++) L += dist(P[i - 1], P[i]); return L; }
function subPath(P, frac) {
  let want = pathLen(P) * clamp(frac);
  const out = [P[0]];
  for (let i = 1; i < P.length; i++) {
    const d = dist(P[i - 1], P[i]);
    if (want >= d) { out.push(P[i]); want -= d; }
    else { const k = want / (d || 1); out.push([lerp(P[i - 1][0], P[i][0], k), lerp(P[i - 1][1], P[i][1], k)]); break; }
  }
  return out;
}
function pointAt(P, frac) { const S = subPath(P, frac); return S[S.length - 1]; }

// ---------------------------------------------------------------------
//  drawing kit — boil, sketchy lines, hatching, stipple, pencil, grain
// ---------------------------------------------------------------------
// smooth hand wobble along the normal; reseeded every boil step
function wobble(P, closed, amt, key, step = 7) {
  const Q = resample(P, closed, step), n = Q.length;
  const R = RNG('wob', key, B);
  const f1 = R.r(0.012, 0.03), f2 = R.r(0.05, 0.1), p1 = R.r(0, TAU), p2 = R.r(0, TAU);
  const sx = R.n(amt * 0.5), sy = R.n(amt * 0.5);
  const out = new Array(n); let s = 0;
  for (let i = 0; i < n; i++) {
    const a = Q[closed ? (i - 1 + n) % n : Math.max(0, i - 1)], b = Q[closed ? (i + 1) % n : Math.min(n - 1, i + 1)];
    const nx = a[1] - b[1], ny = b[0] - a[0], l = Math.hypot(nx, ny) || 1;
    if (i) s += dist(Q[i - 1], Q[i]);
    const o = amt * (0.75 * Math.sin(s * f1 + p1) + 0.35 * Math.sin(s * f2 + p2));
    out[i] = [Q[i][0] + nx / l * o + sx, Q[i][1] + ny / l * o + sy];
  }
  return out;
}
function trace(P, closed) {
  ctx.beginPath();
  const n = P.length; if (n < 2) return;
  if (closed) {
    ctx.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);
    for (let i = 0; i < n; i++) { const p = P[i], q = P[(i + 1) % n]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.closePath();
  } else {
    ctx.moveTo(P[0][0], P[0][1]);
    for (let i = 1; i < n - 1; i++) { const p = P[i], q = P[i + 1]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.lineTo(P[n - 1][0], P[n - 1][1]);
  }
}
// sketchy stroke. o: closed, color, w, amt, key, alpha, frac (write-on), double
function ink(P, o = {}) {
  const closed = !!o.closed, key = o.key ?? 'ink';
  let Q = o.raw ? P : wobble(P, closed, o.amt ?? 1.8, key);
  let cl = closed;
  if (o.frac != null && o.frac < 1) { if (o.frac <= 0) return Q; Q = subPath(closed ? [...Q, Q[0]] : Q, o.frac); cl = false; }
  ctx.strokeStyle = o.color || C.ink; ctx.lineWidth = o.w ?? 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = o.alpha ?? 1;
  trace(Q, cl); ctx.stroke();
  if (o.double) {
    let Q2 = wobble(P, closed, (o.amt ?? 1.8) * 1.6 + 0.8, key + '~');
    if (!cl && closed) Q2 = subPath([...Q2, Q2[0]], o.frac ?? 1);
    ctx.lineWidth = (o.w ?? 3) * 0.4; ctx.globalAlpha = (o.alpha ?? 1) * 0.55; trace(Q2, cl); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  return Q;
}
// filled shape + textures (clipped) + ink outline
function paint(P, o = {}) {
  const key = o.key || 'paint';
  const Q = o.raw ? P : wobble(P, true, o.amt ?? 1.6, key);
  ctx.save();
  trace(Q, true);
  if (o.fill) { ctx.globalAlpha = o.fillAl ?? 1; ctx.fillStyle = o.fill; ctx.fill(); ctx.globalAlpha = 1; }
  if (o.tex) { ctx.clip(); const bb = bbox(Q, 6); o.tex.forEach((t, i) => texture(bb, { key: key + ':' + i, ...t })); }
  ctx.restore();
  if (o.line !== false) {
    ctx.strokeStyle = o.line || C.ink; ctx.lineWidth = o.w ?? 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.globalAlpha = o.lineAl ?? 1; trace(Q, true); ctx.stroke(); ctx.globalAlpha = 1;
  }
  return Q;
}
function texture(bb, t) {
  if (t.k === 'hatch') hatch(bb, t);
  else if (t.k === 'cross') { hatch(bb, t); hatch(bb, { ...t, a: (t.a ?? 0.7) + (t.a2 ?? 1.25), key: t.key + 'x' }); }

  else if (t.k === 'stipple') stipple(bb, t);
  else if (t.k === 'fn') t.fn(bb);
}
// parallel hatching inside current clip. t: a angle, gap, c, w, al, dash [min,max], skip, dens(x,y)
function hatch(bb, t) {
  const a = t.a ?? 0.7, gap = t.gap ?? 7, S = RNG('hs', t.key), R = RNG('hj', t.key, B);
  const cx = (bb.x0 + bb.x1) / 2, cy = (bb.y0 + bb.y1) / 2, rad = Math.hypot(bb.x1 - bb.x0, bb.y1 - bb.y0) / 2 + 4;
  const ca = Math.cos(a), sa = Math.sin(a), dens = t.dens, jit = t.jit ?? 0.9, dash = t.dash;
  ctx.beginPath();
  for (let d = -rad; d <= rad; d += gap) {
    const dd = d + S.n(gap * 0.3);
    let u = -rad + (dash ? S.r(0, dash[1]) : 0);
    while (u < rad) {
      const len = dash ? S.r(dash[0], dash[1]) : rad * 2, u2 = Math.min(rad, u + len);
      const mu = (u + u2) / 2, mx = cx + ca * mu - sa * dd, my = cy + sa * mu + ca * dd, p = S.f();
      if (!dens || p < dens(mx, my)) {
        const e1 = R.n(jit), e2 = R.n(jit);
        ctx.moveTo(cx + ca * u - sa * (dd + e1), cy + sa * u + ca * (dd + e1));
        ctx.lineTo(cx + ca * u2 - sa * (dd + e2), cy + sa * u2 + ca * (dd + e2));

  ctx.stroke(); ctx.globalAlpha = 1;
}
// colored-pencil diagonal strokes
function pencil(bb, t) {
  const S = RNG('ps', t.key), R = RNG('pj', t.key, B);
  const area = (bb.x1 - bb.x0) * (bb.y1 - bb.y0);
  const n = Math.min(t.max ?? 6000, t.n ?? Math.floor(area / (t.per ?? 700)));
  const a = t.a ?? -0.95, L = t.len ?? 14, dens = t.dens;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = S.r(bb.x0, bb.x1), y = S.r(bb.y0, bb.y1), p = S.f(), aa = a + S.n(0.22), l = L * (0.5 + S.f() * 0.7);
    if (dens && p > dens(x, y)) continue;
    const jx = R.n(1.1), jy = R.n(1.1), dx = Math.cos(aa) * l / 2, dy = Math.sin(aa) * l / 2;
    ctx.moveTo(x - dx + jx, y - dy + jy); ctx.lineTo(x + dx + jx, y + dy + jy);
  }
  ctx.strokeStyle = t.c; ctx.lineWidth = t.w ?? 1.4; ctx.globalAlpha = t.al ?? 0.45; ctx.lineCap = 'round';
  ctx.stroke(); ctx.globalAlpha = 1;
}
// square stipple dots
function stipple(bb, t) {
  const S = RNG('ss', t.key), R = RNG('sj', t.key, B);
  const n = t.n ?? 400, sz = t.s ?? 2.2, dens = t.dens, jit = t.jit ?? 0.8;
  ctx.fillStyle = t.c; ctx.globalAlpha = t.al ?? 1; ctx.beginPath();

    const x = S.r(bb.x0, bb.x1), y = S.r(bb.y0, bb.y1), p = S.f(), s = sz * (0.6 + S.f() * 0.8);
    if (dens && p > dens(x, y)) continue;

}
// screen-space paper grain, reseeded with the boil
function grain(o = {}) {
  ctx.save(); screen();
  const R = RNG('grain', B), n = o.n ?? 2600;
  ctx.fillStyle = o.dark || 'rgba(70,45,25,0.13)'; ctx.beginPath();
  for (let i = 0; i < n; i++) ctx.rect(R.r(0, W), R.r(0, H), 1.7, 1.7);
  ctx.fill();
  ctx.fillStyle = o.light || 'rgba(255,250,236,0.20)'; ctx.beginPath();
  for (let i = 0; i < n; i++) ctx.rect(R.r(0, W), R.r(0, H), 1.9, 1.9);
  ctx.fill();

  ctx.strokeStyle = 'rgba(80,55,35,0.07)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i < 90; i++) { const x = R.r(0, W), y = R.r(0, H), a = R.r(0, TAU), l = R.r(6, 22); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); }

}

// ---------------------------------------------------------------------
//  construction lines, rulers, sparks, bursts, rainbow contours
// ---------------------------------------------------------------------
function construct(cx, cy, r, o = {}) {
  const R = RNG('con', o.key ?? 'c', B);
  ctx.save();
  ctx.strokeStyle = o.c || C.lav; ctx.lineWidth = o.w ?? 1.4; ctx.globalAlpha = o.al ?? 1; ctx.lineCap = 'round';
  const a0 = (o.a0 ?? R.r(0, TAU)), sw = o.sweep ?? 1.05;

    ctx.beginPath();
    for (let i = 0; i < o.ticks; i++) { const a = i / o.ticks * TAU + (o.rot ?? 0); ctx.moveTo(cx + Math.cos(a) * (r - 6), cy + Math.sin(a) * (r - 6)); ctx.lineTo(cx + Math.cos(a) * (r + 6), cy + Math.sin(a) * (r + 6)); }
    ctx.stroke();
  }
  ctx.restore();
}
function cline(x1, y1, x2, y2, o = {}) {
  const R = RNG('cl', o.key ?? 'l', B);
  ctx.save(); ctx.strokeStyle = o.c || C.lavS; ctx.lineWidth = o.w ?? 1.2; ctx.globalAlpha = o.al ?? 1;
  ctx.beginPath(); ctx.moveTo(x1 + R.n(1), y1 + R.n(1)); ctx.lineTo(x2 + R.n(1), y2 + R.n(1)); ctx.stroke(); ctx.restore();
}
function ruler(x1, y1, x2, y2, o = {}) {

  for (let i = 0; i < n; i++) { const u = i / (n - 1); bumps.push([cx + (u - 0.5) * 2 * s * (o.wide ?? 1.1) + R.n(s * 0.08), cy - Math.sin(u * Math.PI) * s * (o.tall ?? 0.55) + R.n(s * 0.05), s * (0.32 + Math.sin(u * Math.PI) * 0.28) * R.r(0.85, 1.1)]); }
  bumps.push([cx, cy + s * 0.1, s * 0.55]);
  const path = () => { ctx.beginPath(); for (const [x, y, r] of bumps) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); } };
  const J = RNG('clj', key, B);
  ctx.save(); ctx.lineWidth = o.lw ?? 3.2; ctx.strokeStyle = o.rim || BP.lav; for (const [x, y, r] of bumps) { ctx.beginPath(); ctx.arc(x + J.n(0.8), y + J.n(0.8), r, 0, TAU); ctx.stroke(); }
  ctx.fillStyle = o.body || BP.cream; for (const [x, y, r] of bumps) { ctx.beginPath(); ctx.arc(x, y, r - 2.4, 0, TAU); ctx.fill(); }
  path(); ctx.clip();
  const bb = { x0: cx - s * 1.8, y0: cy - s * 1.2, x1: cx + s * 1.8, y1: cy + s * 0.8 };
  pencil(bb, { key: key + 'p', c: '#ffffff', al: 0.6, per: 60, a: -0.05, len: 40 });
  pencil(bb, { key: key + 's', c: o.shade || BP.lav, al: 0.55, per: 26, a: -0.08, len: 34, w: 1.8, dens: (x, y) => clamp((y - cy + s * 0.15) / (s * 0.6) + (x - cx) / (s * 3)) });
  if (o.warm) pencil(bb, { key: key + 'w', c: o.warm, al: 0.55, per: 40, a: -0.1, len: 30, dens: (x, y) => clamp((cy - y) / (s * 0.5) - (x - cx) / (s * 2)) });
  ctx.restore();
}

// ---- the hero: the shipment. A cream carton with a red band, a barcode label and stamps from each hand-off.
function bpCarton(x, y, s, o = {}) {
  const key = o.key || 'carton', d = s * 0.42, R = RNG('ct', key, B);

  const side = [[x + s / 2, y - s * 0.38], [x + s / 2 + d, y - s * 0.38 - d * 0.6], [x + s / 2 + d, y + s * 0.38 - d * 0.6], [x + s / 2, y + s * 0.38]];
  if (o.shadow !== false) { ctx.save(); ctx.fillStyle = 'rgba(21,26,72,0.28)'; ctx.beginPath(); ctx.ellipse(x + d * 0.6, y + s * 0.4, s * 0.62, s * 0.08, 0, 0, TAU); ctx.fill(); ctx.restore(); }
  bpFill(side, [[y - s, '#c9b48e'], [y + s, '#9c8562']], { key: key + 'sd', lw: Math.max(1.6, s * 0.012) });
  bpFill(resample(top, true, 12), [[y - s, '#f5ead0'], [y, '#e3d2ae']], { key: key + 'tp', lw: Math.max(1.6, s * 0.012) });
  bpFill(front, [[y - s / 2, '#e6d3ac'], [y + s / 2, '#cdb487']], { key: key + 'fr', lw: Math.max(1.8, s * 0.014) });
  // the red band: the one colour that means "this shipment"
  const bw = s * 0.16;
  bpFill(bpRect(x - bw / 2, y - s * 0.38, bw, s * 0.76), [[y - s, BP.red], [y + s, BP.redD]], { key: key + 'band', lw: Math.max(1.2, s * 0.008), lightC: '#ff9a8a' });
  bpFill(resample([[x - bw / 2, y - s * 0.38], [x - bw / 2 + d, y - s * 0.38 - d * 0.6], [x + bw / 2 + d, y - s * 0.38 - d * 0.6], [x + bw / 2, y - s * 0.38]], true, 8), [[y - s, BP.red], [y, BP.redD]], { key: key + 'bandt', lw: Math.max(1.2, s * 0.008) });
  // label with a barcode
  const lx = x - s * 0.44, ly = y - s * 0.05, lw = s * 0.3, lh = s * 0.3;
  ctx.fillStyle = BP.creamW; ctx.fillRect(lx, ly, lw, lh); ctx.strokeStyle = BP.line; ctx.lineWidth = Math.max(1, s * 0.006); ctx.strokeRect(lx, ly, lw, lh);
  const BC = RNG('bc', key); ctx.fillStyle = BP.line; for (let bx = lx + lw * 0.1; bx < lx + lw * 0.9; bx += lw * 0.045) if (BC.f() < 0.7) ctx.fillRect(bx, ly + lh * 0.12, lw * BC.r(0.012, 0.03), lh * 0.45);
  ctx.fillRect(lx + lw * 0.1, ly + lh * 0.7, lw * 0.6, Math.max(1, lh * 0.05)); ctx.fillRect(lx + lw * 0.1, ly + lh * 0.82, lw * 0.4, Math.max(1, lh * 0.05));
  // stamps: one per hand-off so far
  for (let i = 0; i < (o.stamps ?? 0); i++) {
    const sx = x + s * 0.2 + (i % 2) * s * 0.16, sy = y - s * 0.24 + Math.floor(i / 2) * s * 0.16, sr = s * 0.065;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(RNG('stp', key, i).n(0.5)); ctx.strokeStyle = 'rgba(40,56,136,0.85)'; ctx.lineWidth = Math.max(1, s * 0.008);
    ctx.beginPath(); ctx.arc(0, 0, sr, 0, TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, sr * 0.62, 0, TAU); ctx.stroke(); ctx.restore();
  }
}

// ---- light: sun disc, gold rays, stars
function bpSun(x, y, r, key, o = {}) {
  ctx.save(); const g = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * (o.halo ?? 2.4)); g.addColorStop(0, 'rgba(255,240,190,0.7)'); g.addColorStop(1, 'rgba(255,200,120,0)'); ctx.fillStyle = g; ctx.fillRect(x - r * 3, y - r * 3, r * 6, r * 6); ctx.restore();

}
function bpRays(x, y, n, len, key, o = {}) {

}
function bpStars(n, key, y1 = H * 0.5, o = {}) {

}

// ---- ground and town
function bpPole(x, y0, y1, key) {

}

  for (let k = 0; k < 2; k++) { const wx = x + w * (0.18 + k * 0.42), wy = y - h * 0.72; ctx.fillStyle = lit ? '#ffcf6a' : '#6e78b8'; ctx.fillRect(wx, wy, w * 0.22, h * 0.3); ctx.strokeStyle = BP.line; ctx.lineWidth = 1.4; ctx.strokeRect(wx, wy, w * 0.22, h * 0.3); }

function bpTree(x, y, r, key) { for (let k = 0; k < 3; k++) { const R = RNG('tr', key, k); bpFill(ellipsePts(x + R.n(r * 0.4), y - r - k * r * 0.35, r * R.r(0.7, 1), r * 0.7, 0, 24), [[y - r * 2, '#4f9a76'], [y, '#235a52']], { key: key + k, lw: 1.4, a: -0.4, spread: 0.4, len: [8, 30] }); } }

// ---- vehicles
function bpPlane(x, y, L, rot, key, o = {}) {   // a twin-engine freighter, side view, nose to the right; (x, y) = centre
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); const h = L * 0.11;

  const lit = o.night ? [[-h, '#b8bfe0'], [h, '#4c548c']] : [[-h, '#ffffff'], [h, '#a9adc4']];
  bpFill(fin, lit, { key: key + 'f', lw: 2, a: 0, len: [20, 90] });
  bpFill(body, lit, { key: key + 'b', lw: 2.2, a: 0, len: [30, 160] });
  bpFill(wing, lit, { key: key + 'w', lw: 1.8 });

  if (o.gear) { for (const gx of [L * 0.3, -L * 0.08]) { bpLine([[gx, h * 0.5], [gx, h * 0.5 + o.gear]], { w: 4, key: key + 'g' + gx }); ctx.fillStyle = BP.line; ctx.beginPath(); ctx.arc(gx, h * 0.5 + o.gear, h * 0.2, 0, TAU); ctx.fill(); } }

}
function bpTruck(x, y, s, key, o = {}) {   // box truck, side view, facing right; y = ground; a window in the box shows the cargo
  const L = s * 2.6;
  bpFill(bpRect(x - L / 2, y - s * 1.15, L * 0.72, s), [[y - s, '#f2ecdc'], [y, '#c9c1ad']], { key: key + 'box', lw: 2.2, a: 0, len: [30, 120] });
  bpFill(resample([[x + L * 0.25, y - s * 0.15], [x + L * 0.25, y - s * 0.85], [x + L * 0.4, y - s * 0.85], [x + L * 0.5, y - s * 0.5], [x + L * 0.5, y - s * 0.15]], true, 12), [[y - s, o.cab || BP.mid], [y, BP.blue]], { key: key + 'cab', lw: 2.2 });
  ctx.fillStyle = '#d7f0f4'; ctx.fillRect(x + L * 0.3, y - s * 0.78, L * 0.11, s * 0.28);
  for (const wx of [x - L * 0.35, x - L * 0.05, x + L * 0.38]) { ctx.fillStyle = BP.line; ctx.beginPath(); ctx.arc(wx, y - s * 0.12, s * 0.16, 0, TAU); ctx.fill(); ctx.fillStyle = BP.grey; ctx.beginPath(); ctx.arc(wx, y - s * 0.12, s * 0.07, 0, TAU); ctx.fill(); }
  bpLine([[x - L / 2, y - s * 0.15], [x + L * 0.5, y - s * 0.15]], { w: 3, key: key + 'ch' });
}
function bpULD(x, y, s, key, o = {}) {   // an AKE container, side view: one lower corner contoured; y = base
  const P = resample([[x - s * 0.5, y], [x + s * 0.28, y], [x + s * 0.5, y - s * 0.32], [x + s * 0.5, y - s * 0.84], [x - s * 0.5, y - s * 0.84]], true, 14);
  bpFill(P, [[y - s, '#e4e7f2'], [y, '#8b90b4']], { key: key + 'u', lw: 2.4, a: Math.PI / 2, len: [20, 80], spread: 0.04 });
  for (let k = 1; k < 5; k++) bpLine([[x - s * 0.5 + k * s * 0.2, y - s * 0.84], [x - s * 0.5 + k * s * 0.2, k > 3 ? y - s * 0.2 : y]], { w: 1.2, c: 'rgba(29,32,64,0.45)', key: key + 'r' + k });

// ---- night earth: a curved horizon with an atmosphere rim, city glow, routes
function bpGlobe(cy, R, key, o = {}) {
  const cx = W * 0.5, P = ellipsePts(cx, cy, R, R, 0, 120);
  ctx.save(); trace(P, true); ctx.fillStyle = '#1b2358'; ctx.fill(); ctx.clip();
  bpStrokes(cx - R, cy - R, cx + R, cy - R + H, [[cy - R, '#3a4aa0'], [cy - R + 600, '#151a48']], { key: key + 'g', per: 70, a: -0.12, len: [30, 140], light: 0.1 });
  const S = RNG('city', key);
  for (let i = 0; i < (o.cities ?? 60); i++) {
    const a = S.r(-0.9, 0.9) - Math.PI / 2, rr = S.r(R * 0.75, R * 0.995), x = cx + Math.cos(a) * rr * 1.25, y = cy + Math.sin(a) * rr;
    if (y < cy - R + 10) continue;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 26); g.addColorStop(0, 'rgba(255,190,90,0.75)'); g.addColorStop(1, 'rgba(255,150,60,0)'); ctx.fillStyle = g; ctx.fillRect(x - 26, y - 26, 52, 52);
    ctx.fillStyle = '#ffd98a'; for (let k = 0; k < 6; k++) { const J = RNG('cj', key, i, k); ctx.fillRect(x + J.n(12), y + J.n(7), 2.4, 2.4); }
  }
  ctx.restore();
  ink(arcPts(cx, cy, R + 6, -Math.PI * 0.95, -Math.PI * 0.05, 60), { w: 10, color: 'rgba(87,202,214,0.35)', key: key + 'atm' });
  ink(arcPts(cx, cy, R, -Math.PI * 0.95, -Math.PI * 0.05, 60), { w: 3, color: '#cfeff2', key: key + 'rim', amt: 0.3 });
}
function bpArc(x0, y0, x1, y1, hgt, key, o = {}) { const P = []; for (let i = 0; i <= 40; i++) { const u = i / 40; P.push([lerp(x0, x1, u), lerp(y0, y1, u) - Math.sin(u * Math.PI) * hgt]); } ink(P, { w: o.w ?? 2.4, color: o.c ?? 'rgba(150,230,235,0.85)', key, amt: 0.3, frac: o.frac }); return P; }

// ---- captions: a shipping tag on a string, lower left; step number in mono, the step name by hand
function bpTag(num, str) {
  const f = () => {
    const s = popS(E0 + 0.25); if (s <= 0.01) return;
    const x = 70, y = H - 210, w = Math.max(300, handW(str, 64) + 150), h = 120;
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.035); ctx.scale(s, s);
    ctx.fillStyle = 'rgba(21,26,72,0.35)'; ctx.fillRect(8, 10, w, h);
    const P = resample([[0, 0], [w - 30, 0], [w, h / 2], [w - 30, h], [0, h]], true, 14);
    bpFill(P, [[0, BP.creamW], [h, '#e3d9bf']], { key: 'tag' + str, lw: 2.4, len: [20, 90] });
    ctx.beginPath(); ctx.arc(w - 40, h / 2, 10, 0, TAU); ctx.fillStyle = BP.navy; ctx.fill();
    bpLine([[w - 40, h / 2], [w + 40, h / 2 - 50], [w + 90, h / 2 - 140]], { w: 2, c: '#8a6a4a', key: 'tagstr' });
    monoText(num, 26, 50, 30, BP.red, { key: 'tn' + num });
    handText(str, 26 + monoW(30) * 2.6, 82, 64, BP.line, { key: 'tt' + str, frac: ev(E0 + 0.4, 0.5) });
    ctx.restore();
  };
  if (DEFER) DEFER.push(f); else f();
}
function handText(str, x, y, size, color, o = {}) {
  ctx.save(); const R = RNG('ht', o.key ?? str, B); ctx.translate(x + R.n(0.6), y + R.n(0.6));
  ctx.font = `${o.weight ?? 400} ${size}px ${HAND}`; ctx.fillStyle = color; const w = ctx.measureText(str).width, frac = clamp(o.frac ?? 1);
  if (frac <= 0) { ctx.restore(); return w; }
  if (frac < 1) { ctx.beginPath(); ctx.rect(-4, -size * 1.2, w * frac + 4, size * 1.7); ctx.clip(); }
  ctx.fillText(str, 0, 0); ctx.restore(); return w;
}
function handW(str, size) { ctx.save(); ctx.font = `400 ${size}px ${HAND}`; const w = ctx.measureText(str).width; ctx.restore(); return w; }

const STYLE = {

// =====================================================================
//  SCENES — one air shipment, 1080x1350. Red (#d4382c) only ever marks the shipment.

const DAWN = [[0, '#1b2358'], [260, '#283888'], [520, '#2b58b9'], [700, '#3995cb'], [800, '#f0b98a'], [900, '#ef8f3c']];
const DUSK = [[0, '#151a48'], [300, '#283888'], [560, '#5b5fae'], [740, '#e07a6a'], [860, '#ef8f3c'], [920, '#f2c84b']];

function bpCutaway(x, y, s, key, stamps) {   // a window cut into the fuselage: the ULD and the red-band carton inside
  const P = ellipsePts(x, y, s, s * 0.62, 0, 40);

}

function scenePickup() {
  bpSky([[0, '#2b58b9'], [300, '#3995cb'], [700, '#57cad6'], [900, '#96dad6']], { key: 'day' });

function bpArrowArc(x0, y0, x1, y1, hgt, key, o = {}) {   // an arc with an arrowhead at its leading point
  const fr = o.frac ?? 1; if (fr <= 0) return;
  const P = bpArc(x0, y0, x1, y1, hgt, key, o), Q = subPath(P, fr), e = Q[Q.length - 1], p = Q[Math.max(0, Q.length - 3)];
  const a = Math.atan2(e[1] - p[1], e[0] - p[0]), L = o.head ?? 18;
  ctx.save(); ctx.fillStyle = o.c ?? 'rgba(150,230,235,0.95)'; ctx.beginPath(); ctx.moveTo(e[0] + Math.cos(a) * L * 0.6, e[1] + Math.sin(a) * L * 0.6);
  ctx.lineTo(e[0] + Math.cos(a + 2.5) * L, e[1] + Math.sin(a + 2.5) * L); ctx.lineTo(e[0] + Math.cos(a - 2.5) * L, e[1] + Math.sin(a - 2.5) * L); ctx.closePath(); ctx.fill(); ctx.restore();
  return e;
}
function bpPin(x, y, c, key) { const g = ctx.createRadialGradient(x, y, 0, x, y, 46); g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - 46, y - 46, 92, 92); ctx.fillStyle = '#fff6d8'; ctx.beginPath(); ctx.arc(x, y, 8 + (B % 4 < 2 ? 1.5 : 0), 0, TAU); ctx.fill(); ink(ellipsePts(x, y, 20, 20, 0, 24), { closed: true, w: 2, color: c, key }); }

  star4(60, 760, 34, '#fff6d8');
  bpGlobe(2050, 1320, 'earth', { cities: 90 });
  // the whole network: cyan arcs launching from cities, each with an arrowhead
  const S = RNG('net');
  for (let k = 0; k < 14; k++) {
    const x0 = S.r(40, 1040), y0 = S.r(880, 1250); let x1 = x0 + (S.f() < 0.5 ? -1 : 1) * S.r(220, 520); if (x1 < 30 || x1 > 1050) x1 = x0 - (x1 - x0);
    const y1 = clamp(y0 + S.n(60), 880, 1250), h = Math.abs(x1 - x0) * S.r(0.35, 0.55), d = S.r(0, 1.6);
    bpArrowArc(x0, y0, x1, y1, h, 'net' + k, { c: 'rgba(150,230,235,0.75)', w: 1.8, frac: clamp(ev(28 + d * 0.3, 1.8) * 0.9 + 0.1), head: 14 });
  }

  bpPin(o[0], o[1], 'rgba(255,190,90,0.9)', 'pinO'); bpPin(d[0], d[1], 'rgba(212,56,44,0.9)', 'pinD');
  ctx.save(); ctx.setLineDash([2, 12]); bpArc(o[0], o[1], d[0], d[1], 460, 'routeghost', { c: 'rgba(212,56,44,0.45)', w: 3 }); ctx.restore();
